<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Battle - 太空对战</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <div id="app">
    <!-- Error Display -->
    <div id="error-bar" style="display:none;position:fixed;top:0;left:0;right:0;background:#ff3333;color:#fff;padding:8px 16px;z-index:9999;font-size:13px;text-align:center;"></div>

    <!-- Lobby Screen -->
    <div id="lobby-screen" class="screen">
      <h1 class="title">🚀 太空对战</h1>
      <p class="subtitle">Space Battle</p>
      <div id="lobby-actions">
        <button id="btn-create" class="btn btn-primary">创建房间</button>
        <button id="btn-join" class="btn btn-secondary">加入房间</button>
      </div>
      <div id="status-text" style="color:#888;margin-top:12px;font-size:12px;"></div>

      <!-- Room List -->
      <div id="section-roomlist" class="lobby-section" style="display:none;">
        <h2>可用房间</h2>
        <div id="room-list"></div>
        <button id="btn-refresh" class="btn btn-small">刷新列表</button>
        <button id="btn-back-lobby" class="btn btn-small btn-back">返回</button>
      </div>

      <!-- Create Form - Map Select -->
      <div id="section-createmap" class="lobby-section" style="display:none;">
        <h2>创建房间 - 选择地图</h2>
        <div id="map-list" class="map-grid"></div>
        <button id="btn-back-create" class="btn btn-small btn-back">返回</button>
      </div>

      <!-- Ship Select -->
      <div id="section-ship" class="lobby-section" style="display:none;">
        <h2>选择你的飞船</h2>
        <div id="ship-list" class="ship-grid"></div>
        <button id="btn-back-ship" class="btn btn-small btn-back">返回</button>
      </div>

      <!-- Color Select -->
      <div id="section-color" class="lobby-section" style="display:none;">
        <h2>选择飞船颜色</h2>
        <div id="color-list" class="color-grid"></div>
        <button id="btn-back-color" class="btn btn-small btn-back">返回</button>
      </div>

      <!-- Name Input -->
      <div id="section-name" class="lobby-section" style="display:none;">
        <h2>输入你的名字</h2>
        <input type="text" id="player-name" placeholder="输入名字..." maxlength="16" autocomplete="off" />
        <br>
        <button id="btn-confirm-join" class="btn btn-primary">确认加入</button>
        <button id="btn-back-name" class="btn btn-small btn-back">返回</button>
      </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen" style="display:none;">
      <canvas id="game-canvas"></canvas>
      <div id="hud">
        <div id="hud-top">
          <div id="hp-bar-container"><div id="hp-bar-fill"></div><span id="hp-text">100/100</span></div>
          <span id="kill-count">击杀: 0</span>
          <span id="room-info" style="font-size:12px;color:#aaa;"></span>
        </div>
        <div id="minimap-container"><canvas id="minimap-canvas" width="180" height="180"></canvas></div>
        <div id="controls-hint">WASD/方向键移动 | 鼠标瞄准 | 左键/H射击 | 右键/J大招</div>
      </div>
      <div id="announcement-text"></div>
      <div id="game-over-overlay" style="display:none;">
        <div id="game-over-box">
          <h1>🏆 游戏结束！</h1>
          <p id="game-over-message"></p>
          <button id="btn-back-to-lobby" class="btn btn-primary">返回大厅</button>
        </div>
      </div>
      <div id="respawn-overlay" style="display:none;">
        <h2>你被击杀了！</h2>
        <p id="respawn-timer">重生中...</p>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js?v=2"></script>
</body>
</html>
